# Manifest del plugin de Herdr para prdash.
#
# El binario `prdash` debe estar en el PATH del servidor de Herdr
# (`make install` lo deja en ~/.local/bin/prdash). Las teclas NO se declaran
# aquí: se añaden en ~/.config/herdr/config.toml, por ejemplo:
#
#   [[keys.command]]
#   key = "prefix+shift+p"
#   type = "plugin_action"
#   command = "prdash.mount-review"
#   description = "prdash: montar review del PR/MR"
#
# seguido de `herdr server reload-config`.

id = "prdash"
name = "prdash"
version = "0.1.0"
# 0.9.0: CLI de worktree (create/list/remove por socket), layout de panes con
# --no-focus, panes/acciones de plugin y link handlers. Ver
# docs/research/herdr-0.9.1-contract.md.
min_herdr_version = "0.9.0"
description = "Inbox cross-forge de PRs/MRs y orquestador de review: worktree + 3 panes (TUICR, Hunk, agente) sobre Herdr."
platforms = ["linux", "macos"]

# Pane del inbox/orquestador: abre la TUI de prdash en un split.
[[panes]]
id = "inbox"
title = "prdash"
placement = "split"
command = ["prdash", "herdr", "inbox"]

# Acción principal (bindable a una tecla): monta el review del ítem en foco, o
# de la URL clicada si el contexto trae una.
[[actions]]
id = "mount-review"
title = "prdash: montar review del PR/MR"
contexts = ["pane", "workspace"]
command = ["prdash", "herdr", "mount"]

# Acción a la que enrutan los link handlers (Ctrl+click sobre una URL de PR/MR).
[[actions]]
id = "open-url"
title = "prdash: montar review desde una URL clicada"
contexts = ["pane", "workspace"]
command = ["prdash", "herdr", "link"]

# Ctrl+click sobre la URL de un PR de GitHub.
[[link_handlers]]
id = "github-pr"
title = "prdash: review este PR de GitHub"
pattern = '^https://github\.com/[^/]+/[^/]+/pull/\d+(?:[/?#].*)?$'
action = "open-url"

# Ctrl+click sobre la URL de un MR de GitLab (incluye instancias self-managed
# con grupos anidados).
[[link_handlers]]
id = "gitlab-mr"
title = "prdash: review este MR de GitLab"
pattern = '^https?://[^/]+/.+/-/merge_requests/\d+(?:[/?#].*)?$'
action = "open-url"
