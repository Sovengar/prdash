# Worktrunk — PROJECT config for prdash
#
# This file is versioned: it is what the team inherits. Project hooks are ADDED
# to those in ~/.config/worktrunk/config.toml, and they run after the global ones.
# Scalars (worktree-path) are overridden.
#
# prdash is Go, not Node. No pnpm here: the ceremony is mod download, build
# cache and gofmt. The worktree path comes from the global config (`<repo>/.worktrees/`).


# On worktree creation, before anything else: resolve the module. Go's module cache
# is global (~go/pkg/mod), so this only downloads what is missing. It runs
# blocking, but it is instant if everything is already downloaded.
[pre-start]
deps = "go mod download"

# Also on worktree creation, but in the BACKGROUND (does not block).
# Go's build cache is global, but the first build of a new worktree compiles the
# whole repo from scratch. Warming it here is what makes the first `make test` of
# the worktree take seconds instead of half a minute.
[post-start]
warm = "go build ./..."


# Before the squash commit, in wt merge. Cheap and blocking: formatting is
# exactly what fails most often in a Go PR, and the repo requires it in `make test`.
[pre-commit]
fmt = 'test -z "$(gofmt -l $(git ls-files "*.go"))" || { echo "gofmt pending in:"; gofmt -l $(git ls-files "*.go"); exit 1; }'
vet = "go vet ./..."

# After the rebase, before merging. Compilation gate: cheap, and it catches the
# most expensive error (it does not compile). The full suite (`make test`, with
# -race) is left to the human: it does not block the daily flow.
[pre-merge]
build = "go build ./..."

# On the target branch, after merging. `make install` keeps the binary current in
# ~/.local/bin, which is exactly wt's "installing updated binaries" doc step.
# Without it, the `prdash` on the PATH stays on the pre-merge version.
[post-merge]
install = "make install"